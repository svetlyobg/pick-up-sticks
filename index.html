<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick Up Sticks</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #c0c0c0; font-family: "MS Sans Serif", Tahoma, Arial, sans-serif; font-size: 14px;
         display: flex; justify-content: center; padding-top: 20px; user-select: none; }
  .window { border: 2px solid #000; background: #fff; box-shadow: 4px 4px 0 rgba(0,0,0,.4); }
  .title { background: #0000a8; color: #fff; text-align: center; font-weight: bold; padding: 3px 8px; }
  .menubar { display: flex; background: #fff; border-bottom: 1px solid #000; position: relative; }
  .menu { position: relative; padding: 3px 10px; cursor: pointer; }
  .menu:hover, .menu.open { background: #0000a8; color: #fff; }
  .dropdown { display: none; position: absolute; top: 100%; left: 0; background: #fff; color: #000; border: 1px solid #000;
              min-width: 200px; z-index: 10; box-shadow: 2px 2px 0 rgba(0,0,0,.4); }
  .menu.open .dropdown { display: block; }
  .dropdown div { padding: 4px 14px 4px 28px; white-space: nowrap; }
  .dropdown div:hover { background: #0000a8; color: #fff; }
  .dropdown .check { padding-left: 14px; }
  .dropdown .check::before { content: "✓ "; }
  .wrap { position: relative; background: #fff; }
  canvas { display: block; background: #fff; cursor: default; }
  canvas.hand { cursor: pointer; }
  canvas { touch-action: none; -webkit-tap-highlight-color: transparent; }
  .window { max-width: 100%; }
  @media (max-width: 800px), (max-height: 640px) {
    body { padding-top: 0; }
    .window { box-shadow: none; }
    .status { padding: 4px 8px; gap: 2px 10px; }
    .menu { padding: 6px 12px; }
    .dropdown div { padding-top: 9px; padding-bottom: 9px; }
  }
  .status { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 16px; padding: 4px 12px; border-top: 1px solid #000; background: #fff; }
  .status button { font: inherit; padding: 1px 10px; cursor: pointer; }
  .win { display: none; position: absolute; inset: 0; background: rgba(0,0,0,.45); align-items: center; justify-content: center; }
  .win.show { display: flex; }
  .win div { background: #fff; border: 2px solid #000; padding: 18px 26px; text-align: center; }
  .win button { margin-top: 10px; padding: 4px 18px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="window">
  <div class="title" id="title">Pick Up Sticks</div>
  <div class="menubar">
    <div class="menu">Игра
      <div class="dropdown">
        <div id="newGame">Нова игра</div>
        <div id="soundToggle" class="check">Звук</div>
        <div id="shadeToggle" class="check">Сенки и обем</div>
        <div id="hoverToggle" class="check">Контур при посочване</div>
      </div>
    </div>
    <div class="menu">Ниво
      <div class="dropdown" id="levels"></div>
    </div>
    <div class="menu">Помощ
      <div class="dropdown">
        <div id="how">Как се играе</div>
      </div>
    </div>
  </div>
  <div class="wrap">
    <canvas id="cv" width="640" height="440"></canvas>
    <div class="win" id="win"><div><b id="winText"></b><br><button id="again">Нова игра</button></div></div>
  </div>
  <div class="status">
    <span>Време: <b id="time">0:00</b></span>
    <span>Точки: <b id="score">0</b></span>
    <span>Остават: <b id="left">0</b></span>
    <span>Грешки: <b id="errs">0</b></span>
    <button id="hint">Подсказка (−5)</button>
  </div>
</div>

<script>
let W = 760, H = 520;
const STICK_W = 16;
const TYPES = [
  { name: "Червена", color: "#ff0000", pts: 20, count: 1 },
  { name: "Синя",    color: "#0000ff", pts: 10, count: 4 },
  { name: "Лилава",  color: "#ff00ff", pts: 5,  count: 8 },
  { name: "Зелена",  color: "#00ff00", pts: 3,  count: 12 },
  { name: "Жълта",   color: "#ffff00", pts: 2,  count: 16 }
];
const LEVELS = [
  { name: "Лесно (21 пръчици)",  k: 0.5 },
  { name: "Средно (31 пръчици)", k: 0.75 },
  { name: "Трудно (41 пръчици)", k: 1 }
];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const dpr = window.devicePixelRatio || 1;
// размер на дъската: хоризонтална на компютър, вертикална на телефон в портретен режим
const isPortrait = () => innerHeight > innerWidth;
function setSize(w, h) {
  W = w; H = h;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fit();
}
// мащабира дъската да се побере на екрана
function fit() {
  // първо свиваме платното, за да не разширява страницата, и чак тогава мерим екрана
  cv.style.width = "10px"; cv.style.height = "10px";
  const vw = document.documentElement.clientWidth, vh = innerHeight;
  const chrome = document.querySelector(".window").offsetHeight - cv.offsetHeight;
  const k = Math.max(0.3, Math.min(1, (vw - 4) / W, (vh - chrome - 4) / H));
  cv.style.width = Math.floor(W * k) + "px"; cv.style.height = Math.floor(H * k) + "px";
}

// --- звук ---
let soundOn = true, actx = null;
function tone(freq, start, dur, type = "sine", vol = 0.15) {
  if (!soundOn) return;
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  take: () => { tone(600, 0, 0.07, "triangle"); tone(900, 0.06, 0.12, "triangle"); },
  mikado: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * 0.08, 0.15, "square", 0.07)),
  bad: () => { tone(200, 0, 0.18, "sawtooth", 0.1); tone(150, 0.12, 0.25, "sawtooth", 0.1); },
  hint: () => tone(1000, 0, 0.1, "sine"),
  win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.14, 0.22, "triangle"))
};

let level = (() => {
  try { const v = parseInt(localStorage.getItem("pus-level"), 10); return v >= 0 && v < LEVELS.length ? v : 2; }
  catch { return 2; }
})();
let sticks = [], fading = [], score = 0, errs = 0, secs = 0, timer = null, started = false, over = false;
let shadeOn = true, hoverOn = true, hoverId = -1;
let hintId = -1, hintUntil = 0, shake = 0, flashBad = null;

function fmtTime(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

// --- геометрия: правоъгълници, само хоризонтални и вертикални ---
function touches(a, b) {
  return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
}
// пръчицата е свободна, ако никоя по-горна не я докосва
function isFree(i) {
  for (let j = i + 1; j < sticks.length; j++) if (touches(sticks[i], sticks[j])) return false;
  return true;
}

function newGame() {
  clearInterval(timer);
  score = 0; errs = 0; secs = 0; started = false; over = false; hintId = -1; fading = [];
  const port = isPortrait();
  if ((H > W) !== port) setSize(port ? 520 : 760, port ? 760 : 520);
  const k = LEVELS[level].k;
  const list = [];
  TYPES.forEach(t => { for (let n = 0, c = Math.round(t.count * k) || 1; n < c; n++) list.push(t); });
  // 21/31/41 пръчици: добавяме до точния брой със зелени
  const target = [21, 31, 41][level];
  while (list.length < target) list.push(TYPES[4]);
  while (list.length > target) list.pop();
  // микадото най-отдолу не е задължително — разбъркваме реда на слоевете
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  const M = 8;
  sticks = list.map((t, id) => {
    const horiz = Math.random() < 0.5;
    const len = Math.round(220 + Math.random() * 230);
    const w = horiz ? len : STICK_W, h = horiz ? STICK_W : Math.min(len, H - 2 * M);
    const x = Math.round(M + Math.random() * (W - 2 * M - w));
    const y = Math.round(M + Math.random() * (H - 2 * M - h));
    return { id, type: t, x, y, w, h };
  });
  $("title").textContent = "Pick Up Sticks — " + LEVELS[level].name.split(" ")[0];
  $("win").classList.remove("show");
  $("time").textContent = fmtTime(0);
  updateHUD();
}

function updateHUD() {
  $("score").textContent = score;
  $("left").textContent = sticks.length;
  $("errs").textContent = errs;
}

// най-горната пръчица под точката; при докосване с пръст — и най-близката в радиус tol
function pick(x, y, tol = 1) {
  let best = -1, bestD = Infinity;
  for (let i = sticks.length - 1; i >= 0; i--) {
    const s = sticks[i];
    const dx = Math.max(s.x - x, 0, x - (s.x + s.w)), dy = Math.max(s.y - y, 0, y - (s.y + s.h));
    const d = Math.hypot(dx, dy);
    if (d <= 1) return i;
    if (d <= tol && d < bestD) { best = i; bestD = d; }
  }
  return best;
}
function boardPoint(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
const touchTol = () => 10 * W / cv.getBoundingClientRect().width; // ~10 екранни пиксела

function finish() {
  over = true;
  clearInterval(timer);
  setTimeout(sfx.win, 150);
  const title = errs === 0 ? "Безупречни ръце" : errs <= 3 ? "Сръчни пръсти" : errs <= 8 ? "Малко разклатена ръка" : "Слон в магазин за порцелан";
  $("winText").innerHTML = `Браво! Събра всички пръчици за ${fmtTime(secs)} мин.<br>Точки: ${score} · Грешки: ${errs}<br>${title}`;
  $("win").classList.add("show");
}

// мишка: контур при посочване, вдигане с клик
// пръст: докато държиш, виждаш контура; пускаш — вдигаш; плъзни извън пръчицата, за да се откажеш
let touchDown = false;
function hoverAt(e) {
  const i = over ? -1 : pick(...boardPoint(e), e.pointerType === "mouse" ? 1 : touchTol());
  hoverId = i >= 0 ? sticks[i].id : -1;
  cv.classList.toggle("hand", i >= 0);
}
cv.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || touchDown) hoverAt(e); });
cv.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse") { touchDown = true; hoverAt(e); }
});
cv.addEventListener("pointerleave", () => { if (!touchDown) hoverId = -1; });
cv.addEventListener("pointercancel", () => { touchDown = false; hoverId = -1; });
cv.addEventListener("pointerup", e => {
  const touch = e.pointerType !== "mouse";
  touchDown = false;
  if (touch) hoverId = -1;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  takeAt(pick(...boardPoint(e), touch ? touchTol() : 1));
});
function takeAt(i) {
  if (over || i < 0) return;
  if (!started) { started = true; timer = setInterval(() => $("time").textContent = fmtTime(++secs), 1000); }
  const s = sticks[i];
  if (isFree(i)) {
    sticks.splice(i, 1);
    fading.push({ s, t0: performance.now() });
    score += s.type.pts;
    if (s.type === TYPES[0]) sfx.mikado(); else sfx.take();
    if (hintId === s.id) hintId = -1;
    updateHUD();
    if (!sticks.length) finish();
  } else {
    errs++;
    score = Math.max(0, score - 5);
    shake = performance.now();
    flashBad = { id: s.id, t0: performance.now() };
    sfx.bad();
    updateHUD();
  }
}

$("hint").onclick = () => {
  if (over || !sticks.length) return;
  const free = sticks.filter((s, i) => isFree(i));
  if (!free.length) return;
  // подсказка: най-ценната свободна пръчица
  free.sort((a, b) => b.type.pts - a.type.pts);
  hintId = free[0].id; hintUntil = performance.now() + 1800;
  score = Math.max(0, score - 5);
  sfx.hint(); updateHUD();
};

// --- рисуване ---
const SH = 5; // отместване на сянката
function drawShadow(s, alpha = 1) {
  // сянката пада върху пръчиците отдолу и показва коя е отгоре
  ctx.globalAlpha = alpha * 0.4;
  ctx.fillStyle = "#000";
  ctx.fillRect(s.x + SH, s.y + SH, s.w, s.h);
  ctx.globalAlpha = 1;
}
function drawStick(s, alpha = 1, mode = "") {
  if (shadeOn) drawShadow(s, alpha);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = mode === "hint" ? "#000" : s.type.color;
  ctx.fillRect(s.x, s.y, s.w, s.h);
  if (shadeOn && mode !== "hint") {
    // обем: светъл ръб горе/вляво, тъмен долу/вдясно
    ctx.fillStyle = "rgba(255,255,255,.65)";
    ctx.fillRect(s.x + 1, s.y + 1, s.w - 2, 3);
    ctx.fillRect(s.x + 1, s.y + 1, 3, s.h - 2);
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(s.x + 1, s.y + s.h - 4, s.w - 2, 3);
    ctx.fillRect(s.x + s.w - 4, s.y + 1, 3, s.h - 2);
  }
  ctx.strokeStyle = mode === "bad" ? "#ff0000" : "#000";
  ctx.lineWidth = mode === "bad" ? 3 : 1;
  ctx.strokeRect(s.x + 0.5, s.y + 0.5, s.w - 1, s.h - 1);
  ctx.globalAlpha = 1;
}
function drawHover(now) {
  const s = sticks.find(x => x.id === hoverId);
  if (!s) return;
  // пунктирен контур по цялата дължина, видим и през пръчиците отгоре
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.lineDashOffset = -now / 40;
  ctx.strokeStyle = "#000";
  ctx.strokeRect(s.x - 2, s.y - 2, s.w + 4, s.h + 4);
  ctx.strokeStyle = "#fff";
  ctx.lineDashOffset = -now / 40 + 5;
  ctx.setLineDash([4, 6]);
  ctx.strokeRect(s.x - 2, s.y - 2, s.w + 4, s.h + 4);
  ctx.setLineDash([]);
}
function draw(now) {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  if (now - shake < 300) ctx.translate(Math.sin((now - shake) / 18) * 4, 0);
  fading = fading.filter(f => now - f.t0 < 350);
  fading.forEach(f => {
    const p = (now - f.t0) / 350;
    ctx.save();
    ctx.translate(0, -p * 30);
    drawStick(f.s, 1 - p);
    ctx.restore();
  });
  sticks.forEach(s => {
    const hint = s.id === hintId && now < hintUntil && Math.floor(now / 200) % 2 === 0;
    const bad = flashBad && flashBad.id === s.id && now - flashBad.t0 < 500 && Math.floor((now - flashBad.t0) / 100) % 2 === 0;
    drawStick(s, 1, hint ? "hint" : bad ? "bad" : "");
  });
  if (hoverOn && !over) drawHover(now);
  ctx.restore();
  requestAnimationFrame(draw);
}

// --- менюта ---
function buildMenu() {
  const box = $("levels");
  box.innerHTML = "";
  LEVELS.forEach((l, i) => {
    const d = document.createElement("div");
    d.textContent = l.name;
    if (i === level) d.className = "check";
    d.onclick = () => {
      level = i;
      try { localStorage.setItem("pus-level", i); } catch {}
      buildMenu(); newGame();
    };
    box.appendChild(d);
  });
}
document.querySelectorAll(".menu").forEach(m => {
  m.addEventListener("click", e => {
    const wasOpen = m.classList.contains("open");
    document.querySelectorAll(".menu").forEach(x => x.classList.remove("open"));
    if (!wasOpen) m.classList.add("open");
    e.stopPropagation();
  });
});
document.addEventListener("click", () => document.querySelectorAll(".menu").forEach(x => x.classList.remove("open")));
$("newGame").onclick = newGame;
$("again").onclick = newGame;
function setupToggle(id, key, apply) {
  let on; try { on = localStorage.getItem("pus-" + key) !== "0"; } catch { on = true; }
  apply(on); $(id).classList.toggle("check", on);
  $(id).onclick = () => {
    on = !on; apply(on);
    try { localStorage.setItem("pus-" + key, on ? "1" : "0"); } catch {}
    $(id).classList.toggle("check", on);
  };
}
setupToggle("soundToggle", "sound", on => { soundOn = on; });
setupToggle("shadeToggle", "shade", on => { shadeOn = on; });
setupToggle("hoverToggle", "hover", on => { hoverOn = on; });
$("how").onclick = () => alert(
  "Купчина пръчици е хвърлена на масата. Кликай (или докосвай) пръчица, за да я вдигнеш — но само ако отгоре ѝ не лежи друга пръчица.\n\n" +
  "Ако кликнеш пръчица, която е затисната, това е грешка: −5 точки.\n\n" +
  "Точки: червена 20, синя 10, лилава 5, зелена 3, жълта 2.\n\n" +
  "Сенките показват коя пръчица е отгоре: горната хвърля сянка върху тези под нея. Пунктирният контур при посочване показва цялата пръчица, дори частите ѝ под други.\n\n" +
  "На телефон: докато държиш пръста, виждаш контура на пръчицата; пусни, за да я вдигнеш, или плъзни встрани, за да се откажеш.\n\n" +
  "Подсказка показва най-ценната свободна пръчица, но струва 5 точки.\n\n" +
  "Целта е да вдигнеш всички пръчици с възможно най-малко грешки.");

addEventListener("resize", () => {
  if (!started && (H > W) !== isPortrait()) newGame(); else fit();
});
buildMenu();
newGame();
fit();
requestAnimationFrame(draw);
</script>
</body>
</html>
